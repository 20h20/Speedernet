on:
  workflow_dispatch:
name: Deploy theme to Production (SSH)
jobs:
  RSync-Deploy-Action:
    name: RSync-Deploy-Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Set up Node.js
        uses: actions/setup-node@master
        with:
          node-version: '12.x'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: RSync-Deploy-Action
        id: deploy_production
        uses: Pendect/action-rsyncer@v1.1.0
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_PROD }}
        with:
          flags: '-avzr --delete'
          options: '
            --exclude ".git" --exclude ".github" --exclude "node_modules" --exclude "vendor" --exclude ".env" --exclude ".gitignore" --exclude "package.json" --exclude "package-lock.json"'
          src: '.'
          dest: '${{ secrets.SSH_PROD_DEST }}'
      - name: Display status from deploy
        run: echo "${{ steps.deploy_production.outputs.status }}"
